<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Housebiom</title>
<link rel="artifact-thumbnail" href="thumb.jpg">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
/* VOICE: mysterious, cozy, retro
   IDEA: a warp-room hub in Game Boy Advance era pixel art; each door is a world
   PICTURE: the portal chamber fills the screen at an integer pixel scale
   COLOUR and TYPE: the art's warm stone, crimson and teal; Silkscreen for labels
   LAYOUT: full-bleed canvas, sound button top right, labels float over doors */
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#1c0d0c;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
.sound{position:absolute;right:14px;top:12px;z-index:3;width:48px;height:48px;padding:0;background:#2a0a12;border:3px solid #fff3dc;box-shadow:2px 2px 0 #120306;cursor:pointer;display:grid;place-items:center}
.sound:focus-visible{outline:3px solid #8ff0c8;outline-offset:2px}
.sound .w{opacity:0}.sound[aria-pressed=true] .w{opacity:1}.sound[aria-pressed=true] .x{opacity:0}
.help{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:2;font:14px/1.4 Silkscreen,monospace;color:#fff3dc;background:#2a0a12;border:3px solid #fff3dc;padding:6px 10px;text-align:center;pointer-events:none;transition:opacity 1s;max-width:calc(100vw - 24px)}
.veil{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#ffb3a6 0,#c0283c 30%,#3a0610 70%);transition:opacity .45s ease-in}
.veil.on{opacity:1}
.veil.arrive{opacity:1;transition:none}
.veil.arrive.off{opacity:0;transition:opacity .9s ease-out}
@media(prefers-reduced-motion:reduce){.veil,.veil.arrive.off{transition:none}}
</style>
</head>
<body>
<button type="button" class="sound" id="soundBtn" aria-pressed="false" aria-label="Sound"><svg viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="6" width="3" height="4" fill="#fff3dc"/><rect x="5" y="5" width="1" height="6" fill="#fff3dc"/><rect x="6" y="4" width="1" height="8" fill="#fff3dc"/><rect x="7" y="3" width="1" height="10" fill="#fff3dc"/><g class="w" fill="#8ff0c8"><rect x="10" y="6" width="1" height="4"/><rect x="12" y="4" width="1" height="8"/><rect x="11" y="5" width="1" height="1"/><rect x="11" y="10" width="1" height="1"/></g><g class="x" fill="#ff8a8a"><rect x="10" y="6" width="1" height="1"/><rect x="11" y="7" width="1" height="1"/><rect x="12" y="8" width="1" height="1"/><rect x="13" y="9" width="1" height="1"/><rect x="13" y="6" width="1" height="1"/><rect x="12" y="7" width="1" height="1"/><rect x="11" y="8" width="1" height="1"/><rect x="10" y="9" width="1" height="1"/></g></svg></button>
<div class="help" id="help">Fly into the glowing portal, or tap it</div>
<div class="veil" id="veil"></div>
<canvas id="c" role="img" aria-label="A stone hub chamber with five portal doors. The middle portal swirls open and leads to the Gut world; the other four are sealed. Use the arrow keys or drag to fly the winged hero, and fly into the open portal or tap it to enter."></canvas>
<script src="assets/sound.js"></script>
<script>
{
const cv = document.getElementById('c'), g = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sound = window.HBSound;
const BGS = 2, BG_W = 257, BG_H = 145, FRAME_W = 51, FRAME_H = 55, ANCHOR_X = 25, ANCHOR_Y = 22;
const PORTAL = {x0: 112, x1: 145, y0: 35, y1: 105, cx: 128.5, cy: 52, r: 16.5};
const SEALED = [28, 76, 180, 229];
const BRAZIERS = [6, 52, 99, 156, 204, 251];
const bg = new Image(), hero = new Image();
bg.src = 'assets/px-hub.png'; hero.src = 'assets/px-hero.png';

/* sound */
sound.bindButton(document.getElementById('soundBtn'));

/* integer-scale canvas that covers the screen */
let W = 0, H = 0, k = 1, top = 0, left = 0;
function fit() {
  const vw = innerWidth, vh = innerHeight;
  k = Math.max(1, Math.min(Math.ceil(vh / (BG_H * BGS)), Math.floor(vw / 110)));
  W = Math.ceil(vw / k); H = Math.ceil(vh / k);
  cv.width = W; cv.height = H;
  cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px';
  top = Math.floor((H - BG_H * BGS) / 2); left = Math.floor((W - BG_W * BGS) / 2);
  g.imageSmoothingEnabled = false;
}
addEventListener('resize', fit); fit();
const wx = x => left + x * BGS, wy = y => top + y * BGS;

/* portal: its own pixels gently twisting around the centre, like a slow whirlpool */
let src = null, msk = null, pc = null, pimg = null;
bg.onload = () => {
  const w = PORTAL.x1 - PORTAL.x0, h = PORTAL.y1 - PORTAL.y0;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(bg, PORTAL.x0, PORTAL.y0, w, h, 0, 0, w, h);
  try { src = x.getImageData(0, 0, w, h).data; } catch (e) { return; }
  msk = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
    const X = PORTAL.x0 + xx + .5, Y = PORTAL.y0 + y + .5;
    if (X > PORTAL.x0 + 1 && X < PORTAL.x1 - 1 && (Y >= PORTAL.cy || (X - PORTAL.cx) ** 2 + (Y - PORTAL.cy) ** 2 <= (PORTAL.r - 1) ** 2)) msk[y * w + xx] = 1;
  }
  pc = document.createElement('canvas'); pc.width = w; pc.height = h;
  pimg = pc.getContext('2d').createImageData(w, h);
};
function drawPortal(t) {
  if (!src || still) return;
  const w = pc.width, h = pc.height, d = pimg.data;
  const cx = PORTAL.cx - PORTAL.x0, cy = (PORTAL.y1 - PORTAL.y0) * .55;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (!msk[y * w + x]) { d[i + 3] = 0; continue; }
    const dx = x + .5 - cx, dy = (y + .5 - cy) * .55, r = Math.hypot(dx, dy);
    const a = .55 * Math.sin(t * .7 - r * .16) + .25 * Math.sin(t * .31 + r * .05);
    const ca = Math.cos(a), sa = Math.sin(a);
    let sx = Math.round(cx + dx * ca - dy * sa - .5), sy = Math.round(cy + (dx * sa + dy * ca) / .55 - .5);
    sx = Math.max(0, Math.min(w - 1, sx)); sy = Math.max(0, Math.min(h - 1, sy));
    if (!msk[sy * w + sx]) { sx = x; sy = y; }
    const j = (sy * w + sx) * 4;
    d[i] = src[j]; d[i + 1] = src[j + 1]; d[i + 2] = src[j + 2]; d[i + 3] = 255;
  }
  pc.getContext('2d').putImageData(pimg, 0, 0);
  g.drawImage(pc, wx(PORTAL.x0), wy(PORTAL.y0), w * BGS, h * BGS);
  const a = .2 + .12 * Math.sin(t * 2.2);
  g.fillStyle = `rgba(255,120,110,${a})`;
  for (let i = 0; i < 6; i++) g.fillRect(wx(PORTAL.x0 - i * 2), wy(PORTAL.y1) + i * 2, (PORTAL.x1 - PORTAL.x0 + i * 4) * BGS, 2);
}

/* hero: steer with keys or drag; wanders when left alone */
let px = null, py = null, goal = null, lastInput = -99, face = 1, pose = 0, poseUntil = 0, nextPoseAt = 8, wander = null, wanderAt = 0, speed = 0;
let entering = null, inside = 0, pulling = false;
const PULL_R = 56;
const pullParts = Array.from({length: 14}, () => ({a: Math.random() * 6.28, r: 1, life: Math.random()}));
const keys = new Set();
const toNative = e => { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k}; };
const inPortal = (x, y) => x > wx(PORTAL.x0) && x < wx(PORTAL.x1) && y > wy(PORTAL.y0 + 6) && y < wy(PORTAL.y1);
const sealedAt = (x, y) => SEALED.find(sx => Math.abs(x - wx(sx)) < 15 * BGS && y > wy(35) && y < wy(105));
cv.addEventListener('pointerdown', e => {
  if (entering) return;
  const n = toNative(e);
  if (inPortal(n.x, n.y)) { goal = {x: wx(PORTAL.cx) + 6, y: wy(75), portal: true}; lastInput = performance.now() / 1000; return; }
  const s = sealedAt(n.x, n.y);
  if (s !== undefined) { showSealed(s); sound.thud && sound.thud(); return; }
  cv.setPointerCapture(e.pointerId); goal = n;
});
cv.addEventListener('pointermove', e => {
  if (goal && !goal.portal) goal = toNative(e);
  if (e.pointerType === 'mouse' && !goal) { const n = toNative(e); cv.style.cursor = inPortal(n.x, n.y) || sealedAt(n.x, n.y) !== undefined ? 'pointer' : 'grab'; }
});
const endDrag = () => { if (goal && !goal.portal) goal = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => { const kk = e.key.toLowerCase(); if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(kk)) { keys.add(kk); e.preventDefault(); } if ((kk === 'enter' || kk === ' ') && !entering) { goal = {x: wx(PORTAL.cx) + 6, y: wy(75), portal: true}; e.preventDefault(); } });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
setTimeout(() => document.getElementById('help').style.opacity = 0, 7000);

/* labels over the doors */
function showSealed() {}

/* entering the portal */
const veil = document.getElementById('veil');
function enter(t) {
  entering = {t0: t, x: px, y: py};
  goal = null; keys.clear();
  sound.whoosh && sound.whoosh();
  const r = cv.getBoundingClientRect();
  veil.style.setProperty('--x', (r.left + wx(PORTAL.cx) * k) + 'px');
  veil.style.setProperty('--y', (r.top + wy(70) * k) + 'px');
  setTimeout(() => veil.classList.add('on'), still ? 0 : 450);
  setTimeout(() => { location.href = 'gut/index.html'; }, still ? 50 : 950);
}
/* coming back from a world */
if (document.referrer && /\/gut\/?/.test(document.referrer)) {
  veil.classList.add('arrive');
  requestAnimationFrame(() => requestAnimationFrame(() => veil.classList.add('off')));
}
addEventListener('pageshow', e => { if (e.persisted) { veil.classList.remove('on'); entering = null; } });

const motes = Array.from({length: 18}, () => ({x: Math.random() * BG_W, y: 20 + Math.random() * 80, s: .2 + Math.random() * .6, ph: Math.random() * 6}));
const lines = Array.from({length: 4}, (_, i) => ({y: 0, len: 0, t: i / 4}));
const start = performance.now(); let lastT = 0;
function draw(now) {
  const t = (now - start) / 1000, dt = Math.min(.05, t - lastT); lastT = t;
  g.fillStyle = '#1c0d0c'; g.fillRect(0, 0, W, H);
  if (bg.naturalWidth) g.drawImage(bg, left, top, BG_W * BGS, BG_H * BGS);
  drawPortal(t);

  /* braziers flicker */
  for (const bx of BRAZIERS) {
    const f = still ? .5 : .5 + .5 * Math.sin(t * 7 + bx) * Math.sin(t * 3.3 + bx * .5);
    g.fillStyle = `rgba(255,190,120,${.18 + .14 * f})`;
    g.fillRect(wx(bx) - 6, wy(84) - 4, 12, 8);
    g.fillStyle = `rgba(255,236,190,${.5 + .4 * f})`;
    g.fillRect(wx(bx) - 1, wy(86) - (f > .6 ? 3 : 2), 2, 2);
  }
  /* floating embers */
  if (!still) for (const m of motes) {
    m.y -= m.s * dt * 6; if (m.y < 4) { m.y = 100; m.x = Math.random() * BG_W; }
    const a = .4 + .4 * Math.sin(t * 2 + m.ph);
    g.fillStyle = `rgba(255,200,140,${a})`; g.fillRect(Math.round(wx(m.x + Math.sin(t * .6 + m.ph) * 2)), Math.round(wy(m.y)), 1, 1);
  }

  /* hero movement */
  const minX = 26, maxX = W - 34, minY = top + 40, maxY = wy(104) - 34;
  if (px === null) { px = wx(80); py = wy(76); }
  const ox = px, oy = py;
  let scale = 1, alpha = 1;
  if (entering) {
    const e = Math.min(1, (t - entering.t0) / .8), tx = wx(PORTAL.cx), ty = wy(72);
    px = entering.x + (tx - entering.x) * e; py = entering.y + (ty - entering.y) * e;
    scale = 1 - e * .9; alpha = 1 - e * .6;
  } else {
    let vx = 0, vy = 0;
    if (keys.has('arrowleft') || keys.has('a')) vx -= 1;
    if (keys.has('arrowright') || keys.has('d')) vx += 1;
    if (keys.has('arrowup') || keys.has('w')) vy -= 1;
    if (keys.has('arrowdown') || keys.has('s')) vy += 1;
    if (vx || vy) { const m = Math.hypot(vx, vy); px += vx / m * 60 * dt; py += vy / m * 60 * dt; lastInput = t; wander = null; }
    else if (goal) { const gx = goal.x - 6, gy = goal.y, d = Math.hypot(gx - px, gy - py); if (d > 1) { const st = Math.min(d, (goal.portal ? 80 : 70) * dt); px += (gx - px) / d * st; py += (gy - py) / d * st; } lastInput = t; wander = null; }
    else if (!still && t - lastInput > 3) {
      if (!wander || t > wanderAt) {
        let tries = 0;
        do { wander = {x: minX + Math.random() * (maxX - minX), y: minY + 6 + Math.random() * (maxY - minY - 12)}; } while (inPortal(wander.x, wander.y) && ++tries < 10);
        if (inPortal(wander.x, wander.y)) wander.x = wx(60);
        wanderAt = t + 7 + Math.random() * 6;
      }
      const dx = wander.x - px, dy = wander.y - py, d = Math.hypot(dx, dy);
      if (d > 2) { const st = Math.min(d, Math.min(22, d * .9) * dt); px += dx / d * st; py += dy / d * st; }
    }
    px = Math.max(minX, Math.min(maxX, px)); py = Math.max(minY, Math.min(maxY, py));
    const steering = !!(vx || vy || (goal && !goal.portal));
    /* the portal pulls you when you're near and in control; keep flying to slip past */
    const cx = wx(PORTAL.cx), cy = wy(72), pdx = cx - px, pdy = cy - py, pd = Math.hypot(pdx, pdy);
    pulling = (t - lastInput < 3 || (goal && goal.portal)) && pd < PULL_R;
    if (pulling && pd > .5) { const st = Math.min(pd, (12 + 36 * (1 - pd / PULL_R)) * dt); px += pdx / pd * st; py += pdy / pd * st; }
    if (pulling && pd < 7) inside += dt; else inside = 0;
    if ((goal && goal.portal && pd < 7) || inside > (steering ? .9 : .3)) enter(t);
  }
  const vxNow = dt ? (px - ox) / dt : 0;
  speed = speed * .85 + (dt ? Math.hypot(px - ox, py - oy) / dt : 0) * .15;
  const moving = speed > 6;
  if (Math.abs(vxNow) > 4) face = vxNow > 0 ? 1 : -1;
  const kx = Math.round(px), ky = Math.round(py) + (still || entering ? 0 : Math.round(Math.sin(t * 2.2) * 1.5));

  if (!still && speed > 30 && !entering) {
    g.fillStyle = 'rgba(255,235,210,.55)';
    for (const l of lines) {
      l.t += dt * 1.2;
      if (l.t > 1) { l.t = 0; l.y = ky - 4 + Math.floor(Math.random() * 20); l.len = 4 + Math.floor(Math.random() * 7); }
      if (l.len && face > 0) g.fillRect(kx - 28 - Math.floor(l.t * 30), l.y, l.len, 1);
      if (l.len && face < 0) g.fillRect(kx + 24 + Math.floor(l.t * 30), l.y, l.len, 1);
    }
  }
  if (pulling && !entering && !still) {
    const cx = wx(PORTAL.cx), cy = wy(72), pd = Math.hypot(cx - px, cy - py), pw = 1 - pd / PULL_R;
    for (const q of pullParts) {
      q.life += dt * (1.2 + pw * 2);
      if (q.life > 1) { q.life = 0; q.a = Math.random() * 6.28; q.r = 18 + Math.random() * 26; }
      const rr = q.r * (1 - q.life), ang = q.a + q.life * 3;
      g.fillStyle = q.life < .5 ? 'rgba(255,190,170,.8)' : 'rgba(140,240,210,.8)';
      g.fillRect(Math.round(cx + Math.cos(ang) * rr), Math.round(cy + Math.sin(ang) * rr * .9), 1, 1);
    }
    scale = 1 - Math.max(0, pw - .4) * .35;
  }
  let frame = 0;
  if (!still) {
    if (entering) frame = 3;
    else if (moving) { frame = Math.floor(t * 3) % 2; poseUntil = 0; nextPoseAt = t + 6; }
    else {
      if (t > nextPoseAt) { pose = Math.random() < .55 ? 2 : 3; poseUntil = t + 2.4; nextPoseAt = t + 9 + Math.random() * 7; }
      frame = t < poseUntil ? pose : ((t * .8) % 1 < .28 ? 1 : 0);
    }
  }
  if (hero.naturalWidth) {
    g.save(); g.globalAlpha = alpha;
    g.translate(kx, ky); if (entering) g.rotate((t - entering.t0) * 9); g.scale(face * scale, scale);
    g.drawImage(hero, frame * FRAME_W, 0, FRAME_W, FRAME_H, -ANCHOR_X, -ANCHOR_Y, FRAME_W, FRAME_H);
    g.restore();
  }

  if (!still || !lastT) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
if (still) { bg.addEventListener('load', () => requestAnimationFrame(draw)); hero.addEventListener('load', () => requestAnimationFrame(draw)); }
}
</script>
</body>
</html>
